<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Documents sécurisés | Gaëtan Levenes</title><link rel="stylesheet" href="style.css"></head>
<body><main class="vault-page"><section class="vault-card"><p class="eyebrow">Accès sécurisé</p><h1>Documents administratifs</h1><p>Les documents sont chiffrés. Saisissez le code communiqué par Gaëtan pour les consulter.</p><form id="vault-form"><label for="password">Code d’accès</label><input id="password" type="password" autocomplete="current-password" required><button class="button primary" type="submit">Ouvrir les documents</button></form><p id="status" role="status" aria-live="polite"></p><div id="documents" class="document-list" hidden></div><a class="back-link" href="index.html">← Retour au CV</a></section></main>
<script>
const iterations=310000,statusNode=document.querySelector('#status'),documentsNode=document.querySelector('#documents');
async function decrypt(buffer,password){const b=new Uint8Array(buffer),salt=b.slice(0,16),iv=b.slice(16,28),payload=b.slice(28),base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']),key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);return crypto.subtle.decrypt({name:'AES-GCM',iv,tagLength:128},key,payload)}
document.querySelector('#vault-form').addEventListener('submit',async e=>{e.preventDefault();const password=document.querySelector('#password').value;statusNode.textContent='Vérification du code…';documentsNode.hidden=true;try{const r=await fetch('vault/manifest.enc',{cache:'no-store'});if(!r.ok)throw Error();const manifest=JSON.parse(new TextDecoder().decode(await decrypt(await r.arrayBuffer(),password)));documentsNode.replaceChildren();for(const doc of manifest.documents){const button=document.createElement('button');button.className='document-button';button.textContent=`Ouvrir : ${doc.label}`;button.addEventListener('click',async()=>{statusNode.textContent=`Ouverture de ${doc.label}…`;try{const r=await fetch(`vault/${doc.file}`,{cache:'no-store'});const blob=new Blob([await decrypt(await r.arrayBuffer(),password)],{type:doc.type});window.open(URL.createObjectURL(blob),'_blank','noopener');statusNode.textContent=''}catch{statusNode.textContent='Impossible d’ouvrir ce document.'}});documentsNode.append(button)}documentsNode.hidden=false;statusNode.textContent='Accès accordé.'}catch{statusNode.textContent='Code incorrect ou documents indisponibles.'}});
</script></body></html>
